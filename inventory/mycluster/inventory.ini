# Kubespray inventory - 2 node cluster
#   k8s-cp-0 -> 192.168.56.134  control-plane + etcd + worker (schedulable)
#   k8s-w-0  -> 192.168.56.135  worker
# Ansible control node: 192.168.56.133
# Names match the nodes' real hostnames (kubespray sets hostname from inventory_hostname).

[all]
k8s-cp-0 ansible_host=192.168.56.134 ip=192.168.56.134 etcd_member_name=etcd1
k8s-w-0  ansible_host=192.168.56.135 ip=192.168.56.135

[kube_control_plane]
k8s-cp-0

[etcd:children]
kube_control_plane

[kube_node]
k8s-cp-0
k8s-w-0

[k8s_cluster:children]
kube_control_plane
kube_node
